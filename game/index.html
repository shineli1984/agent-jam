<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #e0e0e0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #score {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 16px;
      color: #b8e986;
      text-shadow: 0 0 10px rgba(184, 233, 134, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #branch-hint {
      position: absolute;
      top: 40px;
      left: 20px;
      font-size: 13px;
      color: rgba(184, 233, 134, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(184, 233, 134, 0.35);
      z-index: 10;
      pointer-events: none;
    }
    /* --- Title Screen Overlay --- */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(10, 14, 15, 0.85) 0%, rgba(10, 14, 15, 0.98) 70%);
      transition: opacity 0.8s ease-out;
      pointer-events: auto;
    }
    #title-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #title-screen h1 {
      font-family: monospace;
      font-size: 56px;
      letter-spacing: 18px;
      color: #b8e986;
      text-shadow: 0 0 30px rgba(184, 233, 134, 0.6), 0 0 60px rgba(184, 233, 134, 0.2);
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    #title-screen .tagline {
      font-size: 15px;
      color: rgba(184, 233, 134, 0.55);
      letter-spacing: 4px;
      margin-bottom: 48px;
    }
    #title-screen .prompt {
      font-size: 13px;
      color: rgba(184, 233, 134, 0.4);
      letter-spacing: 3px;
      animation: pulse-prompt 2s ease-in-out infinite;
    }
    @keyframes pulse-prompt {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div id="title-screen">
      <h1>Mycelium</h1>
      <div class="tagline">You are the network. Grow.</div>
      <div class="prompt">press any key</div>
    </div>
    <div id="score">Absorbed: 0</div>
    <div id="branch-hint">Tendril 1/1 &nbsp;[Space to fork, Tab to switch]</div>
    <canvas id="game" width="960" height="640"></canvas>
    <div class="controls">Reach &mdash; arrow keys / WASD &nbsp;&middot;&nbsp; Fork &mdash; space / click &nbsp;&middot;&nbsp; Switch tendril &mdash; tab</div>
  </div>

  <script>
    // --- Title Screen (issue #13: narrative atmosphere) ---
    let gameStarted = false;
    const titleScreen = document.getElementById('title-screen');

    function dismissTitle() {
      if (gameStarted) return;
      gameStarted = true;
      titleScreen.classList.add('fade-out');
      setTimeout(() => { titleScreen.remove(); }, 900);
    }

    window.addEventListener('keydown', function titleHandler(e) {
      if (!gameStarted) {
        e.preventDefault();
        dismissTitle();
      }
    }, { once: false });

    titleScreen.addEventListener('click', dismissTitle);

    // --- Palette (issue #14: Mycelium visual identity) ---
    const PALETTE = {
      deepSoil:     '#0a0e0f',
      myceliumGlow: '#b8e986',
      sporeGold:    '#f4d35e',
      rootAmber:    '#c47335',
      decayViolet:  '#7b2d8e',
    };

    // --- Canvas Setup ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Mycelium Network ---
    const network = {
      nodes: [],   // {x, y, radius}
      segments: [] // {from: nodeIndex, to: nodeIndex}
    };

    // Seed the origin node at center
    const originX = W / 2;
    const originY = H / 2;
    network.nodes.push({ x: originX, y: originY, radius: 6 });

    // --- Branching system (issue #23) ---
    const branches = [{
      tipIndex: 0,
      growing: { x: originX, y: originY, dist: 0 }
    }];
    let activeBranch = 0;

    const BASE_GROW_SPEED = 120;
    let growSpeed = BASE_GROW_SPEED;
    const TENDRIL_MAX_LEN = 40;
    const NODE_RADIUS = 3;
    const EDGE_MARGIN = 12; // issue #31: bounce margin from canvas edge
    const BRANCH_MIN_DIST = 15; // issue #32: minimum travel before allowing a new branch
    let lastBranchTime = 0; // issue #32: cooldown timestamp
    const BRANCH_COOLDOWN = 200; // issue #32: ms cooldown between branches

    let tipIndex = 0;
    let growing = branches[0].growing;

    // --- Particle System ---
    const particles = [];

    function spawnBurst(x, y, color) {
      const c = color || PALETTE.sporeGold;
      const count = 14;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
        const speed = 60 + Math.random() * 100;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 1.8 + Math.random() * 1.2,
          radius: 1.5 + Math.random() * 2.5,
          color: c,
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function renderParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, p.life);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    // --- Nutrients ---
    const nutrients = [];
    const NUTRIENT_COUNT = 8;
    const NUTRIENT_RADIUS = 5;
    const COLLECT_RADIUS = 35; // issue #22: generous collision (was ~13px)
    const MAGNETIC_RADIUS = 130; // chemical gradient range — nutrients start drifting
    const MAGNETIC_STRENGTH = 180; // base pull force (px/s^2)
    const MAGNETIC_DAMPING = 0.92; // velocity damping per frame (keeps motion smooth)
    let score = 0;
    const scoreEl = document.getElementById('score');
    const branchHintEl = document.getElementById('branch-hint');

    function spawnNutrient(nearOrigin) {
      let x, y;
      if (nearOrigin) {
        const angle = Math.random() * Math.PI * 2;
        const d = 50 + Math.random() * 80;
        x = originX + Math.cos(angle) * d;
        y = originY + Math.sin(angle) * d;
      } else {
        const margin = 30;
        x = margin + Math.random() * (W - margin * 2);
        y = margin + Math.random() * (H - margin * 2);
      }
      nutrients.push({
        x: Math.max(10, Math.min(W - 10, x)),
        y: Math.max(10, Math.min(H - 10, y)),
        vx: 0, vy: 0, // magnetic drift velocity
        pull: 0, // 0-1 pull intensity for visual feedback
        radius: NUTRIENT_RADIUS,
        pulse: Math.random() * Math.PI * 2
      });
    }

    // Issue #22: half near origin for immediate gratification
    for (let i = 0; i < NUTRIENT_COUNT; i++) spawnNutrient(i < 4);

    // --- Branching (issue #23) ---
    function createBranch() {
      if (!gameStarted) return; // Block branching until title dismissed
      // Issue #32: prevent ghost branches from rapid Space/Click
      const now = performance.now();
      const current = branches[activeBranch];
      if (current.growing.dist < BRANCH_MIN_DIST || (now - lastBranchTime) < BRANCH_COOLDOWN) return;
      lastBranchTime = now;
      if (current.growing.dist > 5) {
        const newNode = { x: current.growing.x, y: current.growing.y, radius: NODE_RADIUS };
        network.nodes.push(newNode);
        const newIndex = network.nodes.length - 1;
        network.segments.push({ from: current.tipIndex, to: newIndex });
        current.tipIndex = newIndex;
        current.growing.dist = 0;
      }
      const forkTip = current.tipIndex;
      const forkNode = network.nodes[forkTip];
      branches.push({
        tipIndex: forkTip,
        growing: { x: forkNode.x, y: forkNode.y, dist: 0 }
      });
      activeBranch = branches.length - 1;
      spawnBurst(forkNode.x, forkNode.y, PALETTE.myceliumGlow);
      updateBranchHint();
    }

    function updateBranchHint() {
      branchHintEl.textContent = 'Tendril ' + (activeBranch + 1) + '/' + branches.length + '  [Space to fork, Tab to switch]';
    }

    // --- Input ---
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (!gameStarted) return; // Block game input until title dismissed
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === ' ') createBranch();
      if (e.key === 'Tab' && branches.length > 1) {
        e.preventDefault();
        activeBranch = (activeBranch + 1) % branches.length;
        updateBranchHint();
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.key] = false; });
    canvas.addEventListener('click', () => { createBranch(); });

    // --- Helpers ---
    function dist(ax, ay, bx, by) {
      const dx = ax - bx, dy = ay - by;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // --- Update ---
    function update(dt) {
      if (!gameStarted) return; // Pause game until title dismissed

      const branch = branches[activeBranch];
      tipIndex = branch.tipIndex;
      growing = branch.growing;

      // Issue #24: speed scales with score
      growSpeed = BASE_GROW_SPEED + score * 8;

      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len; dy /= len;
        const step = growSpeed * dt;
        growing.x += dx * step;
        growing.y += dy * step;

        // Issue #31: bounce off canvas edges instead of getting stuck
        if (growing.x < EDGE_MARGIN) {
          growing.x = EDGE_MARGIN + (EDGE_MARGIN - growing.x);
        } else if (growing.x > W - EDGE_MARGIN) {
          growing.x = (W - EDGE_MARGIN) - (growing.x - (W - EDGE_MARGIN));
        }
        if (growing.y < EDGE_MARGIN) {
          growing.y = EDGE_MARGIN + (EDGE_MARGIN - growing.y);
        } else if (growing.y > H - EDGE_MARGIN) {
          growing.y = (H - EDGE_MARGIN) - (growing.y - (H - EDGE_MARGIN));
        }
        // Safety clamp in case bounce overshoots
        growing.x = Math.max(EDGE_MARGIN, Math.min(W - EDGE_MARGIN, growing.x));
        growing.y = Math.max(EDGE_MARGIN, Math.min(H - EDGE_MARGIN, growing.y));

        growing.dist += step;
        if (growing.dist >= TENDRIL_MAX_LEN) {
          const newNode = { x: growing.x, y: growing.y, radius: NODE_RADIUS };
          network.nodes.push(newNode);
          const newIndex = network.nodes.length - 1;
          network.segments.push({ from: tipIndex, to: newIndex });
          tipIndex = newIndex;
          branch.tipIndex = newIndex;
          growing.dist = 0;
        }
      }

      updateParticles(dt);

      // --- Magnetic nutrient pull (v0.2: chemical gradients) ---
      // Nutrients drift toward the nearest branch tip within range.
      // Quadratic inverse-distance: gentle far away, strong up close.
      for (const n of nutrients) {
        let closestDist = Infinity;
        let pullDx = 0, pullDy = 0;

        // Check all branch tips (growing points)
        for (const b of branches) {
          const d = dist(n.x, n.y, b.growing.x, b.growing.y);
          if (d < MAGNETIC_RADIUS && d < closestDist && d > 1) {
            closestDist = d;
            pullDx = (b.growing.x - n.x) / d;
            pullDy = (b.growing.y - n.y) / d;
          }
        }

        if (closestDist < MAGNETIC_RADIUS) {
          const falloff = 1 - (closestDist / MAGNETIC_RADIUS);
          const force = MAGNETIC_STRENGTH * falloff * falloff; // quadratic for smooth ramp
          n.vx += pullDx * force * dt;
          n.vy += pullDy * force * dt;
          n.pull = falloff; // store for visual feedback
        } else {
          n.pull *= 0.9; // fade out pull indicator
        }

        // Apply velocity with damping
        n.vx *= MAGNETIC_DAMPING;
        n.vy *= MAGNETIC_DAMPING;
        n.x += n.vx * dt;
        n.y += n.vy * dt;

        // Keep in bounds
        n.x = Math.max(10, Math.min(W - 10, n.x));
        n.y = Math.max(10, Math.min(H - 10, n.y));
      }

      // Issue #22: generous collection radius
      for (let i = nutrients.length - 1; i >= 0; i--) {
        const n = nutrients[i];
        if (dist(growing.x, growing.y, n.x, n.y) < COLLECT_RADIUS) {
          collectNutrient(i); continue;
        }
        let collected = false;
        for (const b of branches) {
          if (dist(b.growing.x, b.growing.y, n.x, n.y) < COLLECT_RADIUS) {
            collectNutrient(i); collected = true; break;
          }
        }
        if (collected) continue;
        for (const node of network.nodes) {
          if (dist(node.x, node.y, n.x, n.y) < n.radius + node.radius + 15) {
            collectNutrient(i); break;
          }
        }
      }
    }

    function collectNutrient(index) {
      const collected = nutrients[index];
      spawnBurst(collected.x, collected.y, PALETTE.sporeGold);
      nutrients.splice(index, 1);
      score++;
      scoreEl.textContent = 'Absorbed: ' + score;
      spawnNutrient(false);
      if (Math.random() < 0.3) spawnNutrient(false);
      scoreEl.style.color = '#fff';
      scoreEl.style.textShadow = '0 0 20px rgba(244, 211, 94, 0.8)';
      setTimeout(function() {
        scoreEl.style.color = PALETTE.myceliumGlow;
        scoreEl.style.textShadow = '0 0 10px rgba(184, 233, 134, 0.5)';
      }, 200);
    }

    // --- Render ---
    function render(now) {
      const glowBoost = Math.min(score * 0.04, 0.6);

      ctx.fillStyle = PALETTE.deepSoil;
      ctx.fillRect(0, 0, W, H);

      // Background grid
      ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.025 + glowBoost * 0.02) + ')';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Border
      ctx.save();
      ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.12 + glowBoost * 0.1) + ')';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8 + glowBoost * 10;
      ctx.shadowColor = 'rgba(184, 233, 134, 0.15)';
      ctx.strokeRect(1, 1, W - 2, H - 2);
      ctx.restore();

      // Network segments — glow intensifies with score
      ctx.save();
      ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.4 + glowBoost * 0.3) + ')';
      ctx.shadowBlur = 6 + glowBoost * 12;
      ctx.shadowColor = PALETTE.myceliumGlow;
      ctx.lineWidth = 2;
      for (const seg of network.segments) {
        const a = network.nodes[seg.from];
        const b = network.nodes[seg.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.restore();

      // All branch tips — issue #33: pulse active tip, dim inactive tips
      const pulseT = now / 1000;
      for (let bi = 0; bi < branches.length; bi++) {
        const b = branches[bi];
        const isActive = bi === activeBranch;
        const tipX = b.growing.x;
        const tipY = b.growing.y;

        // Draw growing segment from last node to tip
        if (b.growing.dist > 0) {
          const tipNode = network.nodes[b.tipIndex];
          ctx.save();
          if (isActive) {
            ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.7 + glowBoost * 0.2) + ')';
            ctx.shadowBlur = 10 + glowBoost * 8;
            ctx.lineWidth = 2.5;
          } else {
            ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.2 + glowBoost * 0.05) + ')';
            ctx.shadowBlur = 2;
            ctx.lineWidth = 1;
          }
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.beginPath();
          ctx.moveTo(tipNode.x, tipNode.y);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();
          ctx.restore();
        }

        // Tip indicator — always visible even at dist 0 (#33)
        ctx.save();
        if (isActive) {
          // Pulsing ring around active tip
          const pulse33 = 0.5 + 0.5 * Math.sin(pulseT * 4);
          const ringRadius = 10 + pulse33 * 6;
          ctx.beginPath();
          ctx.arc(tipX, tipY, ringRadius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.25 + pulse33 * 0.2) + ')';
          ctx.lineWidth = 1.5;
          ctx.shadowBlur = 12 + pulse33 * 10;
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.stroke();

          // Bright core dot
          ctx.beginPath();
          ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(184, 233, 134, 0.95)';
          ctx.shadowBlur = 16 + glowBoost * 10;
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.fill();
        } else {
          // Dimmed inactive tip
          ctx.beginPath();
          ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(184, 233, 134, 0.25)';
          ctx.shadowBlur = 3;
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.fill();
        }
        ctx.restore();
      }

      // Network nodes
      for (let i = 0; i < network.nodes.length; i++) {
        const n = network.nodes[i];
        const isOrigin = i === 0;
        const r = isOrigin ? 6 : n.radius;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin
          ? 'rgba(184, 233, 134, ' + (0.15 + glowBoost * 0.1) + ')'
          : 'rgba(184, 233, 134, ' + (0.08 + glowBoost * 0.06) + ')';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin ? PALETTE.myceliumGlow : 'rgba(184, 233, 134, ' + (0.6 + glowBoost * 0.3) + ')';
        ctx.fill();
      }

      // Nutrients with collection radius hint + magnetic drift trail
      const t = now / 1000;
      for (const n of nutrients) {
        const pulse = 0.6 + 0.4 * Math.sin(t * 3 + n.pulse);
        const pullIntensity = n.pull || 0;

        ctx.save();
        ctx.shadowBlur = 10 + pullIntensity * 12;
        ctx.shadowColor = PALETTE.sporeGold;

        // Magnetic drift trail — a comet-like tail behind moving nutrients
        if (pullIntensity > 0.05) {
          const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
          if (speed > 2) {
            const trailLen = Math.min(speed * 0.15, 18) * pullIntensity;
            const nx = -n.vx / speed;
            const ny = -n.vy / speed;
            const grad = ctx.createLinearGradient(
              n.x, n.y,
              n.x + nx * trailLen, n.y + ny * trailLen
            );
            grad.addColorStop(0, 'rgba(244, 211, 94, ' + (0.4 * pullIntensity) + ')');
            grad.addColorStop(1, 'rgba(244, 211, 94, 0)');
            ctx.beginPath();
            ctx.moveTo(n.x - ny * 3, n.y + nx * 3);
            ctx.lineTo(n.x + ny * 3, n.y - nx * 3);
            ctx.lineTo(n.x + nx * trailLen, n.y + ny * trailLen);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
          }
        }

        // Collection radius hint (fades slightly when being pulled)
        ctx.beginPath();
        ctx.arc(n.x, n.y, COLLECT_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.025 * pulse * (1 - pullIntensity * 0.5)) + ')';
        ctx.fill();

        // Outer glow — brightens when pulled
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 4 + pullIntensity * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.15 * pulse + pullIntensity * 0.15) + ')';
        ctx.fill();

        // Core — intensifies when being pulled
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + pullIntensity * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.7 * pulse + 0.3 + pullIntensity * 0.2) + ')';
        ctx.fill();
        ctx.restore();
      }

      renderParticles();
    }

    // --- Game Loop ---
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render(now);
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
