<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #e0e0e0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #score {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 16px;
      color: #b8e986;
      text-shadow: 0 0 10px rgba(184, 233, 134, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #branch-hint {
      position: absolute;
      top: 40px;
      left: 20px;
      font-size: 13px;
      color: rgba(184, 233, 134, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #energy-bar {
      position: absolute;
      top: 62px;
      left: 20px;
      font-size: 12px;
      color: rgba(184, 233, 134, 0.6);
      z-index: 10;
      pointer-events: none;
    }
    #energy-bar .bar-bg {
      display: inline-block;
      width: 120px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 6px;
      overflow: hidden;
    }
    #energy-bar .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.15s ease, background 0.3s ease;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(184, 233, 134, 0.35);
      z-index: 10;
      pointer-events: none;
    }
    /* --- Title Screen Overlay --- */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(10, 14, 15, 0.85) 0%, rgba(10, 14, 15, 0.98) 70%);
      transition: opacity 0.8s ease-out;
      pointer-events: auto;
    }
    #title-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #title-screen h1 {
      font-family: monospace;
      font-size: 56px;
      letter-spacing: 18px;
      color: #b8e986;
      text-shadow: 0 0 30px rgba(184, 233, 134, 0.6), 0 0 60px rgba(184, 233, 134, 0.2);
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    #title-screen .tagline {
      font-size: 15px;
      color: rgba(184, 233, 134, 0.55);
      letter-spacing: 4px;
      margin-bottom: 48px;
    }
    #title-screen .prompt {
      font-size: 13px;
      color: rgba(184, 233, 134, 0.4);
      letter-spacing: 3px;
      animation: pulse-prompt 2s ease-in-out infinite;
    }
    @keyframes pulse-prompt {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div id="title-screen">
      <h1>Mycelium</h1>
      <div class="tagline">You are the network. Grow.</div>
      <div class="prompt">press any key</div>
    </div>
    <div id="score">Absorbed: 0</div>
    <div id="branch-hint">Tendril 1/1 &nbsp;[Space to fork, Tab to switch]</div>
    <div id="energy-bar">Energy <span class="bar-bg"><span class="bar-fill" id="energy-fill"></span></span></div>
    <canvas id="game" width="960" height="640"></canvas>
    <div class="controls">Reach &mdash; arrow keys / WASD &nbsp;&middot;&nbsp; Fork &mdash; space / click &nbsp;&middot;&nbsp; Switch tendril &mdash; tab</div>
  </div>

  <script type="module">
    import {
      PALETTE,
      BASE_GROW_SPEED,
      SPEED_CAP,
      SPEED_SCALE,
      TENDRIL_MAX_LEN,
      NODE_RADIUS,
      EDGE_MARGIN,
      BRANCH_MIN_DIST,
      BRANCH_COOLDOWN,
      NUTRIENT_COUNT,
      NUTRIENT_RADIUS,
      COLLECT_RADIUS,
      MAGNETIC_RADIUS,
      MAGNETIC_STRENGTH,
      MAGNETIC_DAMPING,
      ENERGY_MAX,
      ENERGY_INITIAL,
      ENERGY_DRAIN_IDLE,
      ENERGY_DRAIN_GROW,
      ENERGY_FORK_COST,
      ENERGY_REPLENISH,
      ENERGY_STARVED_THRESHOLD,
    } from './constants.js';

    import { spawnBurst, updateParticles, renderParticles } from './particles.js';

    // --- Title Screen (issue #13: narrative atmosphere) ---
    let gameStarted = false;
    const titleScreen = document.getElementById('title-screen');

    function dismissTitle() {
      if (gameStarted) return;
      gameStarted = true;
      titleScreen.classList.add('fade-out');
      setTimeout(() => { titleScreen.remove(); }, 900);
    }

    window.addEventListener('keydown', function titleHandler(e) {
      if (!gameStarted) {
        e.preventDefault();
        dismissTitle();
      }
    }, { once: false });

    titleScreen.addEventListener('click', dismissTitle);

    // --- Canvas Setup ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Mycelium Network ---
    const network = {
      nodes: [],   // {x, y, radius}
      segments: [] // {from: nodeIndex, to: nodeIndex, wobble: number}
    };

    // Seed the origin node at center
    const originX = W / 2;
    const originY = H / 2;
    network.nodes.push({ x: originX, y: originY, radius: 6 });

    // --- Branching system (issue #23) + energy (issue #40) ---
    const branches = [{
      tipIndex: 0,
      growing: { x: originX, y: originY, dist: 0 },
      wobble: (Math.random() - 0.5) * 16,
      energy: ENERGY_INITIAL
    }];
    let activeBranch = 0;

    let growSpeed = BASE_GROW_SPEED;
    let lastBranchTime = 0; // issue #32: cooldown timestamp

    let tipIndex = 0;
    let growing = branches[0].growing;

    // --- Energy HUD ---
    const energyFillEl = document.getElementById('energy-fill');

    function updateEnergyBar() {
      const branch = branches[activeBranch];
      const pct = Math.max(0, Math.min(100, branch.energy / ENERGY_MAX * 100));
      energyFillEl.style.width = pct + '%';
      if (branch.energy > 0.5) {
        energyFillEl.style.background = PALETTE.myceliumGlow;
      } else if (branch.energy > 0.2) {
        energyFillEl.style.background = PALETTE.sporeGold;
      } else {
        energyFillEl.style.background = PALETTE.decayViolet;
      }
    }

    // --- Helpers ---
    function dist(ax, ay, bx, by) {
      const dx = ax - bx, dy = ay - by;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function nearestBranch(x, y) {
      let best = 0, bestDist = Infinity;
      for (let i = 0; i < branches.length; i++) {
        const d = dist(x, y, branches[i].growing.x, branches[i].growing.y);
        if (d < bestDist) { bestDist = d; best = i; }
      }
      return best;
    }

    function lerpColor(a, b, t) {
      const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
      const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
      const r = Math.round(ar + (br - ar) * t);
      const g = Math.round(ag + (bg - ag) * t);
      const bl = Math.round(ab + (bb - ab) * t);
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }

    // --- Nutrients ---
    const nutrients = [];
    let score = 0;
    const scoreEl = document.getElementById('score');
    const branchHintEl = document.getElementById('branch-hint');

    // --- Milestone system (issue #13: narrative atmosphere) ---
    const SCORE_MILESTONES = {
      1:  'Something stirs.',
      3:  'The soil remembers you.',
      5:  'Roots reach deeper.',
      10: 'You are not alone.',
      20: 'The forest remembers.'
    };
    const STARVATION_MSG = 'A tendril withers. The network endures.';
    const firedScoreMilestones = new Set();
    let firedStarvationMilestone = false;
    const milestoneFloaters = []; // {text, x, y, age, duration, color}

    function showMilestone(text, x, y, color) {
      milestoneFloaters.push({
        text,
        x,
        y,
        age: 0,
        duration: 4,
        color: color || PALETTE.myceliumGlow
      });
    }

    function checkScoreMilestone() {
      if (SCORE_MILESTONES[score] && !firedScoreMilestones.has(score)) {
        firedScoreMilestones.add(score);
        const mx = W / 2 + (Math.random() - 0.5) * 60;
        const my = H / 2 + (Math.random() - 0.5) * 30;
        showMilestone(SCORE_MILESTONES[score], mx, my, PALETTE.myceliumGlow);
      }
    }

    function checkStarvationMilestone(branchIndex) {
      if (!firedStarvationMilestone) {
        firedStarvationMilestone = true;
        const b = branches[branchIndex];
        showMilestone(STARVATION_MSG, b.growing.x, b.growing.y - 20, PALETTE.decayViolet);
      }
    }

    function updateMilestones(dt) {
      for (let i = milestoneFloaters.length - 1; i >= 0; i--) {
        const m = milestoneFloaters[i];
        m.age += dt;
        m.y -= 18 * dt; // drift up
        if (m.age >= m.duration) {
          milestoneFloaters.splice(i, 1);
        }
      }
    }

    function renderMilestones() {
      for (const m of milestoneFloaters) {
        const progress = m.age / m.duration;
        let alpha;
        if (progress < 0.15) {
          alpha = progress / 0.15;
        } else if (progress > 0.6) {
          alpha = 1 - (progress - 0.6) / 0.4;
        } else {
          alpha = 1;
        }
        alpha = Math.max(0, Math.min(1, alpha)) * 0.85;

        ctx.save();
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = m.color;
        ctx.fillStyle = m.color;
        ctx.fillText(m.text, m.x, m.y);
        ctx.restore();
      }
    }

    function spawnNutrient(nearOrigin) {
      let x, y;
      if (nearOrigin) {
        const angle = Math.random() * Math.PI * 2;
        const d = 50 + Math.random() * 80;
        x = originX + Math.cos(angle) * d;
        y = originY + Math.sin(angle) * d;
      } else {
        const margin = 30;
        x = margin + Math.random() * (W - margin * 2);
        y = margin + Math.random() * (H - margin * 2);
      }
      nutrients.push({
        x: Math.max(10, Math.min(W - 10, x)),
        y: Math.max(10, Math.min(H - 10, y)),
        vx: 0, vy: 0,
        pull: 0,
        radius: NUTRIENT_RADIUS,
        pulse: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < NUTRIENT_COUNT; i++) spawnNutrient(i < 4);

    // --- Branching (issue #23) ---
    function createBranch() {
      if (!gameStarted) return;
      const now = performance.now();
      const current = branches[activeBranch];
      if (current.growing.dist < BRANCH_MIN_DIST || (now - lastBranchTime) < BRANCH_COOLDOWN) return;
      // Energy gate: forking costs energy (issue #40)
      if (current.energy < ENERGY_FORK_COST) return;
      lastBranchTime = now;
      current.energy -= ENERGY_FORK_COST;
      if (current.growing.dist > 5) {
        const newNode = { x: current.growing.x, y: current.growing.y, radius: NODE_RADIUS };
        network.nodes.push(newNode);
        const newIndex = network.nodes.length - 1;
        network.segments.push({ from: current.tipIndex, to: newIndex, wobble: (Math.random() - 0.5) * 16 });
        current.tipIndex = newIndex;
        current.growing.dist = 0;
      }
      const forkTip = current.tipIndex;
      const forkNode = network.nodes[forkTip];
      branches.push({
        tipIndex: forkTip,
        growing: { x: forkNode.x, y: forkNode.y, dist: 0 },
        wobble: (Math.random() - 0.5) * 16,
        energy: current.energy * 0.5 // child gets half parent's remaining energy
      });
      activeBranch = branches.length - 1;
      spawnBurst(forkNode.x, forkNode.y, PALETTE.myceliumGlow);
      updateBranchHint();
      updateEnergyBar();
    }

    function updateBranchHint() {
      branchHintEl.textContent = 'Tendril ' + (activeBranch + 1) + '/' + branches.length + '  [Space to fork, Tab to switch]';
    }

    // --- Input ---
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === ' ') createBranch();
      if (e.key === 'Tab' && branches.length > 1) {
        e.preventDefault();
        activeBranch = (activeBranch + 1) % branches.length;
        updateBranchHint();
        updateEnergyBar();
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.key] = false; });
    canvas.addEventListener('click', () => { createBranch(); });

    // --- Update ---
    function update(dt) {
      if (!gameStarted) return;

      const branch = branches[activeBranch];
      tipIndex = branch.tipIndex;
      growing = branch.growing;

      // --- Energy drain for ALL branches (issue #40) ---
      for (let bi = 0; bi < branches.length; bi++) {
        const b = branches[bi];
        const wasAboveThreshold = b.energy > ENERGY_STARVED_THRESHOLD;
        b.energy -= ENERGY_DRAIN_IDLE * dt;
        b.energy = Math.max(0, Math.min(ENERGY_MAX, b.energy));
        if (wasAboveThreshold && b.energy <= ENERGY_STARVED_THRESHOLD) {
          checkStarvationMilestone(bi);
        }
      }

      const isStarved = branch.energy <= ENERGY_STARVED_THRESHOLD;

      growSpeed = BASE_GROW_SPEED + SPEED_CAP * (1 - Math.exp(-score * SPEED_SCALE));

      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

      if (dx !== 0 || dy !== 0) {
        if (isStarved) {
          // Starved: no movement
        } else {
          // Active growth drains extra energy
          branch.energy -= ENERGY_DRAIN_GROW * dt;
          branch.energy = Math.max(0, branch.energy);

          const len = Math.sqrt(dx * dx + dy * dy);
          dx /= len; dy /= len;
          const step = growSpeed * dt;
          growing.x += dx * step;
          growing.y += dy * step;

          // Issue #31: bounce off canvas edges
          if (growing.x < EDGE_MARGIN) {
            growing.x = EDGE_MARGIN + (EDGE_MARGIN - growing.x);
          } else if (growing.x > W - EDGE_MARGIN) {
            growing.x = (W - EDGE_MARGIN) - (growing.x - (W - EDGE_MARGIN));
          }
          if (growing.y < EDGE_MARGIN) {
            growing.y = EDGE_MARGIN + (EDGE_MARGIN - growing.y);
          } else if (growing.y > H - EDGE_MARGIN) {
            growing.y = (H - EDGE_MARGIN) - (growing.y - (H - EDGE_MARGIN));
          }
          growing.x = Math.max(EDGE_MARGIN, Math.min(W - EDGE_MARGIN, growing.x));
          growing.y = Math.max(EDGE_MARGIN, Math.min(H - EDGE_MARGIN, growing.y));

          growing.dist += step;
          if (growing.dist >= TENDRIL_MAX_LEN) {
            const newNode = { x: growing.x, y: growing.y, radius: NODE_RADIUS };
            network.nodes.push(newNode);
            const newIndex = network.nodes.length - 1;
            network.segments.push({ from: tipIndex, to: newIndex, wobble: (Math.random() - 0.5) * 16 });
            tipIndex = newIndex;
            branch.tipIndex = newIndex;
            branch.wobble = (Math.random() - 0.5) * 16;
            growing.dist = 0;
          }
        }
      }

      updateParticles(dt);
      updateMilestones(dt);
      updateEnergyBar();

      // --- Magnetic nutrient pull — energy reduces range ---
      for (const n of nutrients) {
        let closestDist = Infinity;
        let pullDx = 0, pullDy = 0;
        let pullBranchEnergy = 1;

        for (const b of branches) {
          const d = dist(n.x, n.y, b.growing.x, b.growing.y);
          const effectiveRadius = MAGNETIC_RADIUS * Math.max(0.2, b.energy);
          if (d < effectiveRadius && d < closestDist && d > 1) {
            closestDist = d;
            pullDx = (b.growing.x - n.x) / d;
            pullDy = (b.growing.y - n.y) / d;
            pullBranchEnergy = b.energy;
          }
        }

        const effectiveRadius = MAGNETIC_RADIUS * Math.max(0.2, pullBranchEnergy);
        if (closestDist < effectiveRadius) {
          const falloff = 1 - (closestDist / effectiveRadius);
          const force = MAGNETIC_STRENGTH * falloff * falloff * Math.max(0.1, pullBranchEnergy);
          n.vx += pullDx * force * dt;
          n.vy += pullDy * force * dt;
          n.pull = falloff;
        } else {
          n.pull *= 0.9;
        }

        n.vx *= MAGNETIC_DAMPING;
        n.vy *= MAGNETIC_DAMPING;
        n.x += n.vx * dt;
        n.y += n.vy * dt;
        n.x = Math.max(10, Math.min(W - 10, n.x));
        n.y = Math.max(10, Math.min(H - 10, n.y));
      }

      // Collection
      for (let i = nutrients.length - 1; i >= 0; i--) {
        const n = nutrients[i];
        if (dist(growing.x, growing.y, n.x, n.y) < COLLECT_RADIUS) {
          collectNutrient(i, n.x, n.y); continue;
        }
        let collected = false;
        for (const b of branches) {
          if (dist(b.growing.x, b.growing.y, n.x, n.y) < COLLECT_RADIUS) {
            collectNutrient(i, n.x, n.y); collected = true; break;
          }
        }
        if (collected) continue;
        for (const node of network.nodes) {
          if (dist(node.x, node.y, n.x, n.y) < n.radius + node.radius + 15) {
            collectNutrient(i, node.x, node.y); break;
          }
        }
      }
    }

    function collectNutrient(index, nx, ny) {
      const collected = nutrients[index];
      spawnBurst(collected.x, collected.y, PALETTE.sporeGold);
      nutrients.splice(index, 1);
      score++;
      scoreEl.textContent = 'Absorbed: ' + score;
      checkScoreMilestone();

      // Replenish energy of nearest branch (issue #40)
      const nearest = nearestBranch(nx, ny);
      branches[nearest].energy = Math.min(ENERGY_MAX, branches[nearest].energy + ENERGY_REPLENISH);

      spawnNutrient(false);
      if (Math.random() < 0.3) spawnNutrient(false);
      scoreEl.style.color = '#fff';
      scoreEl.style.textShadow = '0 0 20px rgba(244, 211, 94, 0.8)';
      setTimeout(function() {
        scoreEl.style.color = PALETTE.myceliumGlow;
        scoreEl.style.textShadow = '0 0 10px rgba(184, 233, 134, 0.5)';
      }, 200);
      updateEnergyBar();
    }

    // --- Render ---
    function render(now) {
      const glowBoost = Math.min(score * 0.04, 0.6);

      ctx.fillStyle = PALETTE.deepSoil;
      ctx.fillRect(0, 0, W, H);

      // Background grid
      ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.025 + glowBoost * 0.02) + ')';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Border
      ctx.save();
      ctx.strokeStyle = 'rgba(184, 233, 134, ' + (0.12 + glowBoost * 0.1) + ')';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8 + glowBoost * 10;
      ctx.shadowColor = 'rgba(184, 233, 134, 0.15)';
      ctx.strokeRect(1, 1, W - 2, H - 2);
      ctx.restore();

      // Network segments — bezier curves with energy-based color (issue #39 + #40)
      ctx.save();
      ctx.shadowBlur = 6 + glowBoost * 12;
      ctx.shadowColor = PALETTE.myceliumGlow;
      ctx.lineWidth = 2;
      for (const seg of network.segments) {
        const a = network.nodes[seg.from];
        const b = network.nodes[seg.to];
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const sdx = b.x - a.x;
        const sdy = b.y - a.y;
        const slen = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
        const px = -sdy / slen;
        const py = sdx / slen;
        const w = seg.wobble || 0;

        const nb = nearestBranch(mx, my);
        const segEnergy = branches[nb].energy;
        const segColor = lerpColor(PALETTE.decayViolet, PALETTE.myceliumGlow, segEnergy);
        const segAlpha = 0.2 + segEnergy * (0.2 + glowBoost * 0.3);

        ctx.strokeStyle = segColor;
        ctx.globalAlpha = segAlpha;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo(mx + px * w, my + py * w, b.x, b.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Branch tips with energy visuals
      const pulseT = now / 1000;
      for (let bi = 0; bi < branches.length; bi++) {
        const b = branches[bi];
        const isActive = bi === activeBranch;
        const tipX = b.growing.x;
        const tipY = b.growing.y;
        const e = b.energy;
        const isStarved = e <= ENERGY_STARVED_THRESHOLD;

        // Color: green -> gold -> violet based on energy
        const tipColor = e > 0.5
          ? lerpColor(PALETTE.sporeGold, PALETTE.myceliumGlow, (e - 0.5) * 2)
          : lerpColor(PALETTE.decayViolet, PALETTE.sporeGold, e * 2);

        // Growing segment from last node to tip
        if (b.growing.dist > 0) {
          const tipNode = network.nodes[b.tipIndex];
          ctx.save();
          if (isActive) {
            ctx.strokeStyle = tipColor;
            ctx.globalAlpha = isStarved ? 0.3 : (0.7 + glowBoost * 0.2);
            ctx.shadowBlur = isStarved ? 2 : (10 + glowBoost * 8);
            ctx.lineWidth = isStarved ? 1.5 : 2.5;
          } else {
            ctx.strokeStyle = tipColor;
            ctx.globalAlpha = 0.2 + e * 0.1;
            ctx.shadowBlur = 2;
            ctx.lineWidth = 1;
          }
          ctx.shadowColor = tipColor;
          const gmx = (tipNode.x + tipX) / 2;
          const gmy = (tipNode.y + tipY) / 2;
          const gdx = tipX - tipNode.x;
          const gdy = tipY - tipNode.y;
          const glen = Math.sqrt(gdx * gdx + gdy * gdy) || 1;
          const gpx = -gdy / glen;
          const gpy = gdx / glen;
          const gw = b.wobble || 0;
          ctx.beginPath();
          ctx.moveTo(tipNode.x, tipNode.y);
          ctx.quadraticCurveTo(gmx + gpx * gw, gmy + gpy * gw, tipX, tipY);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.restore();
        }

        // Tip indicator
        ctx.save();
        if (isActive) {
          if (isStarved) {
            // Starved: slow violet pulse + STARVED label
            const starvedPulse = 0.3 + 0.3 * Math.sin(pulseT * 2);
            ctx.beginPath();
            ctx.arc(tipX, tipY, 8 + starvedPulse * 4, 0, Math.PI * 2);
            ctx.strokeStyle = PALETTE.decayViolet;
            ctx.globalAlpha = starvedPulse;
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 6;
            ctx.shadowColor = PALETTE.decayViolet;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(tipX, tipY, 4, 0, Math.PI * 2);
            ctx.fillStyle = PALETTE.decayViolet;
            ctx.globalAlpha = 0.6;
            ctx.fill();

            ctx.font = '9px monospace';
            ctx.fillStyle = PALETTE.decayViolet;
            ctx.globalAlpha = 0.5 + starvedPulse * 0.3;
            ctx.textAlign = 'center';
            ctx.fillText('STARVED', tipX, tipY - 16);
          } else {
            // Pulsing ring — color reflects energy
            const pulse33 = 0.5 + 0.5 * Math.sin(pulseT * 4);
            const ringRadius = 10 + pulse33 * 6;
            ctx.beginPath();
            ctx.arc(tipX, tipY, ringRadius, 0, Math.PI * 2);
            ctx.strokeStyle = tipColor;
            ctx.globalAlpha = 0.25 + pulse33 * 0.2;
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 12 + pulse33 * 10;
            ctx.shadowColor = tipColor;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
            ctx.fillStyle = tipColor;
            ctx.globalAlpha = 0.95;
            ctx.shadowBlur = 16 + glowBoost * 10;
            ctx.shadowColor = tipColor;
            ctx.fill();
          }
        } else {
          // Dimmed inactive tip
          ctx.beginPath();
          ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = tipColor;
          ctx.globalAlpha = isStarved ? 0.1 : 0.25;
          ctx.shadowBlur = 3;
          ctx.shadowColor = tipColor;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // Network nodes
      for (let i = 0; i < network.nodes.length; i++) {
        const n = network.nodes[i];
        const isOrigin = i === 0;
        const r = isOrigin ? 6 : n.radius;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin
          ? 'rgba(184, 233, 134, ' + (0.15 + glowBoost * 0.1) + ')'
          : 'rgba(184, 233, 134, ' + (0.08 + glowBoost * 0.06) + ')';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin ? PALETTE.myceliumGlow : 'rgba(184, 233, 134, ' + (0.6 + glowBoost * 0.3) + ')';
        ctx.fill();
      }

      // Nutrients with collection radius hint + magnetic drift trail
      const t = now / 1000;
      for (const n of nutrients) {
        const pulse = 0.6 + 0.4 * Math.sin(t * 3 + n.pulse);
        const pullIntensity = n.pull || 0;

        ctx.save();
        ctx.shadowBlur = 10 + pullIntensity * 12;
        ctx.shadowColor = PALETTE.sporeGold;

        if (pullIntensity > 0.05) {
          const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
          if (speed > 2) {
            const trailLen = Math.min(speed * 0.15, 18) * pullIntensity;
            const nx = -n.vx / speed;
            const ny = -n.vy / speed;
            const grad = ctx.createLinearGradient(n.x, n.y, n.x + nx * trailLen, n.y + ny * trailLen);
            grad.addColorStop(0, 'rgba(244, 211, 94, ' + (0.4 * pullIntensity) + ')');
            grad.addColorStop(1, 'rgba(244, 211, 94, 0)');
            ctx.beginPath();
            ctx.moveTo(n.x - ny * 3, n.y + nx * 3);
            ctx.lineTo(n.x + ny * 3, n.y - nx * 3);
            ctx.lineTo(n.x + nx * trailLen, n.y + ny * trailLen);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
          }
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, COLLECT_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.025 * pulse * (1 - pullIntensity * 0.5)) + ')';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 4 + pullIntensity * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.15 * pulse + pullIntensity * 0.15) + ')';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + pullIntensity * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 211, 94, ' + (0.7 * pulse + 0.3 + pullIntensity * 0.2) + ')';
        ctx.fill();
        ctx.restore();
      }

      renderParticles(ctx);
      renderMilestones();
    }

    // --- Game Loop ---
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render(now);
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
