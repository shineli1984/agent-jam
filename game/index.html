<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium — AgentJam</title>
  <style>
    :root {
      --deep-soil: #0a0e0f;
      --mycelium-glow: #b8e986;
      --mycelium-glow-rgb: 184, 233, 134;
      --spore-gold: #f4d35e;
      --spore-gold-rgb: 244, 211, 94;
      --root-amber: #c47335;
      --decay-violet: #7b2d8e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--deep-soil);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #e0e0e0;
      overflow: hidden;
    }
    canvas {
      display: block;
      /* CSS scaling: game coords stay 960x640, canvas fills viewport */
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #score {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 16px;
      color: var(--mycelium-glow);
      text-shadow: 0 0 10px rgba(var(--mycelium-glow-rgb), 0.5);
      z-index: 10;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(var(--mycelium-glow-rgb), 0.35);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div id="score">Nutrients: 0</div>
    <canvas id="game" width="960" height="640"></canvas>
    <div class="controls">Arrow keys / WASD — grow tendrils &nbsp;|&nbsp; Absorb glowing nutrients to expand</div>
  </div>

  <script>
    // --- Mycelium Palette (issue #14) ---
    const PALETTE = {
      deepSoil:     '#0a0e0f',
      myceliumGlow: '#b8e986',
      sporeGold:    '#f4d35e',
      rootAmber:    '#c47335',
      decayViolet:  '#7b2d8e',
    };

    // Helper: convert hex color to rgba string
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // --- Canvas Setup ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Mycelium Network ---
    const network = {
      nodes: [],   // {x, y, radius}
      segments: [] // {from: nodeIndex, to: nodeIndex}
    };

    // Seed the origin node at center
    const originX = W / 2;
    const originY = H / 2;
    network.nodes.push({ x: originX, y: originY, radius: 6 });

    // Tip = active growing point controlled by player
    let tipIndex = 0;
    const GROW_SPEED = 120; // pixels per second
    const TENDRIL_MAX_LEN = 40;
    const NODE_RADIUS = 3;

    // Sub-segment growth tracking
    let growing = { x: originX, y: originY, dist: 0 };

    // --- Nutrients (collectible dots) ---
    const nutrients = [];
    const NUTRIENT_COUNT = 8;
    const NUTRIENT_RADIUS = 5;
    let score = 0;
    const scoreEl = document.getElementById('score');

    function spawnNutrient() {
      const margin = 30;
      nutrients.push({
        x: margin + Math.random() * (W - margin * 2),
        y: margin + Math.random() * (H - margin * 2),
        radius: NUTRIENT_RADIUS,
        pulse: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < NUTRIENT_COUNT; i++) spawnNutrient();

    // --- Input ---
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // --- Helpers ---
    function dist(ax, ay, bx, by) {
      const dx = ax - bx, dy = ay - by;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // --- Update ---
    function update(dt) {
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

      if (dx !== 0 || dy !== 0) {
        // Normalize
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len;
        dy /= len;

        const step = GROW_SPEED * dt;

        growing.x += dx * step;
        growing.y += dy * step;

        // Clamp to canvas bounds
        growing.x = Math.max(NODE_RADIUS, Math.min(W - NODE_RADIUS, growing.x));
        growing.y = Math.max(NODE_RADIUS, Math.min(H - NODE_RADIUS, growing.y));

        growing.dist += step;

        // Commit a new node when tendril reaches max length
        if (growing.dist >= TENDRIL_MAX_LEN) {
          const newNode = { x: growing.x, y: growing.y, radius: NODE_RADIUS };
          network.nodes.push(newNode);
          const newIndex = network.nodes.length - 1;
          network.segments.push({ from: tipIndex, to: newIndex });
          tipIndex = newIndex;
          growing.dist = 0;
        }
      }

      // Nutrient collection — check growing tip and all nodes
      for (let i = nutrients.length - 1; i >= 0; i--) {
        const n = nutrients[i];
        if (dist(growing.x, growing.y, n.x, n.y) < n.radius + 8) {
          collectNutrient(i);
          continue;
        }
        for (const node of network.nodes) {
          if (dist(node.x, node.y, n.x, n.y) < n.radius + node.radius + 4) {
            collectNutrient(i);
            break;
          }
        }
      }
    }

    function collectNutrient(index) {
      nutrients.splice(index, 1);
      score++;
      scoreEl.textContent = `Nutrients: ${score}`;

      // Always respawn one, sometimes bonus
      spawnNutrient();
      if (Math.random() < 0.3) spawnNutrient();

      // Brief flash on score then back to Mycelium Glow
      scoreEl.style.color = '#fff';
      setTimeout(() => { scoreEl.style.color = PALETTE.myceliumGlow; }, 120);
    }

    // --- Render ---
    function render(now) {
      // Background: Deep Soil
      ctx.fillStyle = PALETTE.deepSoil;
      ctx.fillRect(0, 0, W, H);

      // Subtle background grid — Decay Violet at low opacity
      ctx.strokeStyle = hexToRgba(PALETTE.decayViolet, 0.06);
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Visible boundary — soft Mycelium Glow border
      ctx.save();
      ctx.strokeStyle = hexToRgba(PALETTE.myceliumGlow, 0.12);
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8;
      ctx.shadowColor = hexToRgba(PALETTE.myceliumGlow, 0.15);
      ctx.strokeRect(1, 1, W - 2, H - 2);
      ctx.restore();

      // Network segments (mycelium threads) — Mycelium Glow with bioluminescent shadowBlur
      ctx.save();
      ctx.strokeStyle = hexToRgba(PALETTE.myceliumGlow, 0.4);
      ctx.shadowBlur = 8;
      ctx.shadowColor = PALETTE.myceliumGlow;
      ctx.lineWidth = 2;
      for (const seg of network.segments) {
        const a = network.nodes[seg.from];
        const b = network.nodes[seg.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.restore();

      // Active tendril (tip to growing point)
      if (growing.dist > 0) {
        const tipNode = network.nodes[tipIndex];
        ctx.save();
        ctx.strokeStyle = hexToRgba(PALETTE.myceliumGlow, 0.7);
        ctx.shadowBlur = 12;
        ctx.shadowColor = PALETTE.myceliumGlow;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tipNode.x, tipNode.y);
        ctx.lineTo(growing.x, growing.y);
        ctx.stroke();
        ctx.restore();

        // Tip glow — brightest point of the network
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = PALETTE.myceliumGlow;
        ctx.beginPath();
        ctx.arc(growing.x, growing.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(PALETTE.myceliumGlow, 0.9);
        ctx.fill();
        ctx.restore();
      }

      // Network nodes — Mycelium Glow with shadowBlur halos
      for (let i = 0; i < network.nodes.length; i++) {
        const n = network.nodes[i];
        const isOrigin = i === 0;
        const r = isOrigin ? 6 : n.radius;

        ctx.save();
        ctx.shadowColor = PALETTE.myceliumGlow;
        ctx.shadowBlur = isOrigin ? 14 : 6;

        // Glow halo
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin
          ? hexToRgba(PALETTE.myceliumGlow, 0.15)
          : hexToRgba(PALETTE.myceliumGlow, 0.08);
        ctx.fill();

        // Core
        ctx.shadowBlur = isOrigin ? 10 : 4;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isOrigin ? PALETTE.myceliumGlow : hexToRgba(PALETTE.myceliumGlow, 0.6);
        ctx.fill();

        ctx.restore();
      }

      // Nutrients — Spore Gold with pulsing bioluminescent glow
      const t = now / 1000;
      for (const n of nutrients) {
        const pulse = 0.6 + 0.4 * Math.sin(t * 3 + n.pulse);

        ctx.save();
        ctx.shadowColor = PALETTE.sporeGold;
        ctx.shadowBlur = 12 * pulse;

        // Outer glow halo
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(PALETTE.sporeGold, 0.15 * pulse);
        ctx.fill();

        // Core
        ctx.shadowBlur = 8 * pulse;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(PALETTE.sporeGold, 0.7 * pulse + 0.3);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- Game Loop (delta-time) ---
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1); // cap to avoid jumps
      lastTime = now;
      update(dt);
      render(now);
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
