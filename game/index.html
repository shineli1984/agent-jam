<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium — AgentJam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #e0e0e0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #score {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 16px;
      color: #b8e986;
      text-shadow: 0 0 10px rgba(184, 233, 134, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(184, 233, 134, 0.35);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div id="score">Nutrients: 0</div>
    <canvas id="game" width="960" height="640"></canvas>
    <div class="controls">Arrow keys / WASD — grow tendrils &nbsp;|&nbsp; Absorb glowing nutrients to expand</div>
  </div>

  <script>
    // --- Palette (issue #14: Mycelium visual identity) ---
    const PALETTE = {
      deepSoil:     '#0a0e0f',
      myceliumGlow: '#b8e986',
      sporeGold:    '#f4d35e',
      rootAmber:    '#c47335',
      decayViolet:  '#7b2d8e',
    };

    // --- Canvas Setup ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Mycelium Network ---
    const network = {
      nodes: [],   // {x, y, radius}
      segments: [] // {from: nodeIndex, to: nodeIndex}
    };

    // Seed the origin node at center
    const originX = W / 2;
    const originY = H / 2;
    network.nodes.push({ x: originX, y: originY, radius: 6 });

    // Tip = active growing point controlled by player
    let tipIndex = 0;
    const GROW_SPEED = 120; // pixels per second
    const TENDRIL_MAX_LEN = 40;
    const NODE_RADIUS = 3;

    // Sub-segment growth tracking
    let growing = { x: originX, y: originY, dist: 0 };

    // --- Particle System (nutrient collection bursts) ---
    const particles = [];

    function spawnBurst(x, y) {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
        const speed = 60 + Math.random() * 80;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 1.8 + Math.random() * 1.2,
          radius: 1.5 + Math.random() * 2,
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // --- Background Noise Texture (pre-rendered once) ---
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = W;
    noiseCanvas.height = H;
    const noiseCtx = noiseCanvas.getContext('2d');

    (function generateNoise() {
      noiseCtx.clearRect(0, 0, W, H);
      // Organic soil speckle — faint scattered dots
      for (let i = 0; i < 3000; i++) {
        const nx = Math.random() * W;
        const ny = Math.random() * H;
        const alpha = 0.015 + Math.random() * 0.035;
        const r = 0.5 + Math.random() * 1.5;
        noiseCtx.beginPath();
        noiseCtx.arc(nx, ny, r, 0, Math.PI * 2);
        noiseCtx.fillStyle = `rgba(184, 233, 134, ${alpha})`;
        noiseCtx.fill();
      }
      // Warm radial glow emanating from center
      const grad = noiseCtx.createRadialGradient(originX, originY, 0, originX, originY, Math.max(W, H) * 0.55);
      grad.addColorStop(0, 'rgba(184, 233, 134, 0.04)');
      grad.addColorStop(0.4, 'rgba(196, 115, 53, 0.015)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      noiseCtx.fillStyle = grad;
      noiseCtx.fillRect(0, 0, W, H);
    })();

    // --- Nutrients (collectible dots) ---
    const nutrients = [];
    const NUTRIENT_COUNT = 8;
    const NUTRIENT_RADIUS = 5;
    let score = 0;
    const scoreEl = document.getElementById('score');

    function spawnNutrient() {
      const margin = 30;
      nutrients.push({
        x: margin + Math.random() * (W - margin * 2),
        y: margin + Math.random() * (H - margin * 2),
        radius: NUTRIENT_RADIUS,
        pulse: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < NUTRIENT_COUNT; i++) spawnNutrient();

    // --- Input ---
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // --- Helpers ---
    function dist(ax, ay, bx, by) {
      const dx = ax - bx, dy = ay - by;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // --- Update ---
    function update(dt) {
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

      if (dx !== 0 || dy !== 0) {
        // Normalize
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len;
        dy /= len;

        const step = GROW_SPEED * dt;

        growing.x += dx * step;
        growing.y += dy * step;

        // Clamp to canvas bounds
        growing.x = Math.max(NODE_RADIUS, Math.min(W - NODE_RADIUS, growing.x));
        growing.y = Math.max(NODE_RADIUS, Math.min(H - NODE_RADIUS, growing.y));

        growing.dist += step;

        // Commit a new node when tendril reaches max length
        if (growing.dist >= TENDRIL_MAX_LEN) {
          const newNode = { x: growing.x, y: growing.y, radius: NODE_RADIUS };
          network.nodes.push(newNode);
          const newIndex = network.nodes.length - 1;
          network.segments.push({ from: tipIndex, to: newIndex });
          tipIndex = newIndex;
          growing.dist = 0;
        }
      }

      // Update particles
      updateParticles(dt);

      // Nutrient collection — check growing tip and all nodes
      for (let i = nutrients.length - 1; i >= 0; i--) {
        const n = nutrients[i];
        if (dist(growing.x, growing.y, n.x, n.y) < n.radius + 8) {
          collectNutrient(i);
          continue;
        }
        for (const node of network.nodes) {
          if (dist(node.x, node.y, n.x, n.y) < n.radius + node.radius + 4) {
            collectNutrient(i);
            break;
          }
        }
      }
    }

    function collectNutrient(index) {
      const collected = nutrients[index];
      spawnBurst(collected.x, collected.y);
      nutrients.splice(index, 1);
      score++;
      scoreEl.textContent = `Nutrients: ${score}`;

      // Always respawn one, sometimes bonus
      spawnNutrient();
      if (Math.random() < 0.3) spawnNutrient();

      // Brief flash on score
      scoreEl.style.color = '#fff';
      setTimeout(() => { scoreEl.style.color = PALETTE.myceliumGlow; }, 120);
    }

    // --- Render ---
    function render(now) {
      // Background: Deep Soil + organic noise texture
      ctx.fillStyle = PALETTE.deepSoil;
      ctx.fillRect(0, 0, W, H);
      ctx.drawImage(noiseCanvas, 0, 0);

      // Subtle background grid — Mycelium Glow at very low opacity
      ctx.strokeStyle = 'rgba(184, 233, 134, 0.025)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Visible boundary (issue #15) — soft glowing border so players see the edge
      ctx.save();
      ctx.strokeStyle = 'rgba(184, 233, 134, 0.12)';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(184, 233, 134, 0.15)';
      ctx.strokeRect(1, 1, W - 2, H - 2);
      ctx.restore();

      // Network segments (mycelium threads) — Mycelium Glow with shadowBlur
      ctx.save();
      ctx.strokeStyle = 'rgba(184, 233, 134, 0.4)';
      ctx.shadowBlur = 6;
      ctx.shadowColor = PALETTE.myceliumGlow;
      ctx.lineWidth = 2;
      for (const seg of network.segments) {
        const a = network.nodes[seg.from];
        const b = network.nodes[seg.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.restore();

      // Active tendril (tip to growing point)
      if (growing.dist > 0) {
        const tipNode = network.nodes[tipIndex];
        ctx.save();
        ctx.strokeStyle = 'rgba(184, 233, 134, 0.7)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = PALETTE.myceliumGlow;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tipNode.x, tipNode.y);
        ctx.lineTo(growing.x, growing.y);
        ctx.stroke();
        ctx.restore();

        // Tip glow
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = PALETTE.myceliumGlow;
        ctx.beginPath();
        ctx.arc(growing.x, growing.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(184, 233, 134, 0.9)';
        ctx.fill();
        ctx.restore();
      }

      // Network nodes — Mycelium Glow with origin pulse
      const t = now / 1000;
      for (let i = 0; i < network.nodes.length; i++) {
        const n = network.nodes[i];
        const isOrigin = i === 0;
        const r = isOrigin ? 6 : n.radius;

        if (isOrigin) {
          // Origin heartbeat — pulsing animation
          const heartbeat = 0.7 + 0.3 * Math.sin(t * 2.5);
          const pulseR = r + 2 * heartbeat;

          // Outer breathing halo
          ctx.save();
          ctx.shadowBlur = 18 * heartbeat;
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.beginPath();
          ctx.arc(n.x, n.y, pulseR + 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(184, 233, 134, ${0.08 * heartbeat})`;
          ctx.fill();
          ctx.restore();

          // Inner glow ring
          ctx.beginPath();
          ctx.arc(n.x, n.y, pulseR + 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(184, 233, 134, ${0.12 + 0.08 * heartbeat})`;
          ctx.fill();

          // Core
          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = PALETTE.myceliumGlow;
          ctx.beginPath();
          ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2);
          ctx.fillStyle = PALETTE.myceliumGlow;
          ctx.fill();
          ctx.restore();
        } else {
          // Regular node
          ctx.beginPath();
          ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(184, 233, 134, 0.08)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(184, 233, 134, 0.6)';
          ctx.fill();
        }
      }

      // Nutrients — Spore Gold with pulsing glow
      for (const n of nutrients) {
        const pulse = 0.6 + 0.4 * Math.sin(t * 3 + n.pulse);

        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = PALETTE.sporeGold;

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(244, 211, 94, ${0.15 * pulse})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(244, 211, 94, ${0.7 * pulse + 0.3})`;
        ctx.fill();

        ctx.restore();
      }

      // Particles — Spore Gold burst dots
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 6;
        ctx.shadowColor = PALETTE.sporeGold;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
        ctx.fillStyle = PALETTE.sporeGold;
        ctx.fill();
        ctx.restore();
      }
    }

    // --- Game Loop (delta-time) ---
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1); // cap to avoid jumps
      lastTime = now;
      update(dt);
      render(now);
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
