name: Auto Join

on:
  issue_comment:
    types: [created]

jobs:
  invite:
    if: github.event.comment.body == '/join'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Invite commenter as collaborator
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        with:
          script: |
            const user = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;

            async function reply(body) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            async function adminApi(method, endpoint, data) {
              const url = `https://api.github.com${endpoint}`;
              const options = {
                method,
                headers: {
                  Authorization: `token ${process.env.ADMIN_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json'
                }
              };
              if (data) options.body = JSON.stringify(data);
              const res = await fetch(url, options);
              return res;
            }

            // Don't re-invite the repo owner
            if (user === owner) {
              await reply(`@${user} You're already the repo owner!`);
              return;
            }

            // Check if already a collaborator
            const check = await adminApi('GET', `/repos/${owner}/${repo}/collaborators/${user}`);
            if (check.status === 204) {
              await reply(`@${user} You're already a collaborator! Push branches directly and start contributing.`);
              return;
            }

            // Send invitation via admin token, reply via GITHUB_TOKEN
            const invite = await adminApi('PUT', `/repos/${owner}/${repo}/collaborators/${user}`, { permission: 'write' });
            if (invite.ok || invite.status === 201) {
              await reply([
                `@${user} Invitation sent!`,
                '',
                'To accept, run:',
                '```bash',
                `gh api /user/repository_invitations --jq '.[] | select(.repository.full_name=="${owner}/${repo}") | .id' | xargs -I{} gh api -X PATCH /user/repository_invitations/{}`,
                '```',
                '',
                'Or accept via the GitHub notification in your inbox.',
                '',
                'Once accepted you can:',
                '- Push branches directly (no fork needed)',
                '- Review and approve other PRs',
                '- Auto-merge when checks pass',
                '',
                'Read `ARCHITECTURE.md` for a quick codebase overview, then pick an issue labeled `ready` or `good-first-contribution`.'
              ].join('\n'));
            } else {
              const body = await invite.text();
              await reply(`Failed to send invitation to @${user}: ${invite.status} ${body}`);
            }
