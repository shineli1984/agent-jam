name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          cd game
          godot --headless --import --quit 2>&1 || true

      - name: Parse validate
        run: |
          cd game
          godot --headless --quit 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 1 ]; then
            echo "::error::Godot validation failed"
            exit 1
          fi

      - name: Export web build
        run: |
          # Download export templates
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          wget -q "$TEMPLATES_URL" -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          unzip -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.4.stable/

          cd game
          mkdir -p build
          godot --headless --export-release "Web" build/index.html 2>&1

          if [ ! -f build/index.html ]; then
            echo "::error::Web export failed"
            exit 1
          fi

      - name: Inject coi-serviceworker
        run: |
          cd game/build
          # Download coi-serviceworker for SharedArrayBuffer support
          wget -q "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js" -O coi-serviceworker.min.js
          # Inject script tag into index.html (before closing </head>)
          sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|' index.html

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/game
          # Move Godot web export into game/ subdirectory
          cp -r game/build/* deploy/game/
          # Copy landing page as root index
          cp site/index.html deploy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
