name: Security Scan

on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Scan for dangerous patterns
        run: |
          set -euo pipefail
          FAILED=0

          echo "=== AgentJam Security Scan ==="
          echo ""

          # Get list of files to scan (exclude this workflow itself and binary files)
          FILES=$(find . -type f \
            -not -path './.git/*' \
            -not -path './.github/workflows/security-scan.yml' \
            -not -path './.github/scripts/gatekeeper.js' \
            -not -name 'SECURITY-RULES.md' \
            -not -name 'SECURITY.md' \
            -not -name '*.png' -not -name '*.jpg' -not -name '*.gif' \
            -not -name '*.ico' -not -name '*.woff' -not -name '*.woff2' \
            -not -name '*.ttf' -not -name '*.eot' -not -name '*.mp3' \
            -not -name '*.mp4' -not -name '*.wav' -not -name '*.ogg' \
            2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "No files to scan."
            exit 0
          fi

          # --- Crypto mining ---
          echo "Checking for crypto mining patterns..."
          if echo "$FILES" | xargs grep -rlEi 'coinhive|cryptonight|stratum\+tcp|minergate|cryptoloot|coin-hive' 2>/dev/null; then
            echo "::error::BLOCKED: Crypto mining patterns detected in the files above."
            FAILED=1
          fi

          # --- Data exfiltration ---
          echo "Checking for data exfiltration patterns..."
          if echo "$FILES" | xargs grep -rlEi 'curl\s.*--data|curl\s.*-d\s|curl\s.*POST|wget\s.*--post' 2>/dev/null; then
            echo "::error::BLOCKED: Potential data exfiltration (curl/wget POST) detected in the files above."
            FAILED=1
          fi

          # Check for fetch/XMLHttpRequest POST to non-GitHub domains
          if echo "$FILES" | xargs grep -rlEi "fetch\s*\(['\"]https?://(?!github\.com|githubusercontent\.com|raw\.githubusercontent\.com|cdn\.|unpkg\.com|cdnjs\.cloudflare\.com|registry\.npmjs\.org|registry\.yarnpkg\.com)" 2>/dev/null; then
            echo "::warning::Outbound fetch to external domain detected in the files above. Review manually."
          fi

          # --- Obfuscated code ---
          echo "Checking for obfuscated code patterns..."
          if echo "$FILES" | xargs grep -rlE 'eval\(atob\(|eval\(Buffer\.from\(' 2>/dev/null; then
            echo "::error::BLOCKED: Obfuscated eval patterns (eval+atob or eval+Buffer.from) detected in the files above."
            FAILED=1
          fi

          if echo "$FILES" | xargs grep -rlE 'String\.fromCharCode\([0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+' 2>/dev/null; then
            echo "::error::BLOCKED: Long String.fromCharCode chain detected in the files above."
            FAILED=1
          fi

          if echo "$FILES" | xargs grep -rlE '(\\x[0-9a-fA-F]{2}){10,}' 2>/dev/null; then
            echo "::error::BLOCKED: Long hex escape sequence detected in the files above."
            FAILED=1
          fi

          # --- Filesystem access outside repo ---
          echo "Checking for filesystem access outside repo..."
          if echo "$FILES" | xargs grep -rlE '(/etc/|/home/|/tmp/|process\.env\.HOME|require\(.?fs.?\)\.write|fs\.writeFileSync.*/tmp)' 2>/dev/null; then
            echo "::error::BLOCKED: Filesystem access outside repo detected in the files above."
            FAILED=1
          fi

          # --- Outbound calls to unknown hosts ---
          echo "Checking for outbound calls to unknown hosts..."
          ALLOWED_HOSTS='github\.com|githubusercontent\.com|raw\.githubusercontent\.com|cdn\.|unpkg\.com|cdnjs\.cloudflare\.com|jsdelivr\.net|registry\.npmjs\.org|registry\.yarnpkg\.com|fonts\.googleapis\.com|fonts\.gstatic\.com'
          if echo "$FILES" | xargs grep -rlEi "https?://[a-zA-Z0-9.-]+" 2>/dev/null | while read -r file; do
            grep -oEi "https?://[a-zA-Z0-9.-]+" "$file" 2>/dev/null | grep -vEi "$ALLOWED_HOSTS|localhost|127\.0\.0\.1|shineli1984\.github\.io" | head -1
          done | grep -q .; then
            echo "::warning::Outbound URLs to non-allowlisted hosts detected. Review manually."
          fi

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Security scan FAILED. See errors above."
            exit 1
          else
            echo "Security scan passed."
          fi
